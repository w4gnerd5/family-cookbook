# Design tokens — single source for print (Typst) and web (CSS).
# Edit here, then run: python3 scripts/build_tokens.py

font:
  serif: "Spectral"            # recipe text (Latin + Cyrillic)
  sans: "Inter"                # wayfinding labels
  serif_georgian: "Noto Serif Georgian"   # fallback for Mkhedruli text

color:
  paper: "#FFFFFF"
  ink: "#221F1B"
  body: "#3A362F"
  muted: "#5C564A"
  label: "#9A917D"
  accent: "#C05B38"           # terracotta
  field: "#F1ECE1"            # fallback verso background when no dish photo
  original_bg: "#F1ECE1"      # Original block box (O2). Undecided; the O4
                              #   alternative is a terracotta wash, "#FAF2EE".
                              #   Variant sheet: print/orig-proof.typ

size:                          # points (print); web build maps pt -> rem
  body: 10.5
  small: 9
  label: 7.5
  footer: 6.5                  # smaller than label so the longest slug + the
                               #   page suffix + a 16pt gap share one line;
                               #   sized to the worst case (traditional-
                               #   georgian-bread-shaping-instructions)
  title: 20
  description: 11

space:
  page_margin: 54              # pt, outside/top/bottom
  gutter: 80                   # pt inner margin: 4-ring punch strip + buffer (~28mm)
  bleed: 8.5                   # pt = 3mm; production/trimmed runs (Doxzoo). 0 for home proofs
  block: 12
  label_gap: 5

card:
  cap: 330                     # pt; max card width on the band verso
  ref: 385                     # pt; height reference (cap applies to tall scans)
  gutter_intrude: 55           # pt a card may reach into the gutter. At 55 the card
                               #   edge enters the punch strip (holes ~9-15mm from
                               #   the bound edge): the ring punch may clip the card.
                               #   Deliberate — the cards are art here, not text.
  snapshot_3: 275              # pt; card width when 3 scans scatter
  snapshot_4: 230              # pt; 4 or more
  title_col: 44                # % of page width for the verso title block; the
                               #   card's left edge must clear this
  title_col_snapshot: 58       # % on snapshot versos (cards sit higher there)

label:
  tracking: 0.14               # em, uppercase label letterspacing
